# Configurazione Mosquitto per pyHPSU MQTT Integration
# File: /mosquitto/config/mosquitto.conf

# Impostazioni generali
persistence true
persistence_location /mosquitto/data/

# File di log
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connessioni
connection_messages true
log_timestamp true

# Listener MQTT standard
listener 1883
protocol mqtt

# WebSocket listener (opzionale, per client web)
listener 9001
protocol websockets

# Sicurezza (configurazione base)
# Per produzione, configura autenticazione e TLS
allow_anonymous true

# Limiti connessione
max_connections -1
max_inflight_messages 0
max_queued_messages 0

# Persistenza messaggi
autosave_interval 1800
autosave_on_changes false

# Impostazioni client
persistent_client_expiration 1d